<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%" fill="none" role="img" aria-label="Kyaw Zay Ya Hein — Identity Masthead">
  <defs>
    <linearGradient id="mhCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </linearGradient>
    <linearGradient id="monogramGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1C24"/>
      <stop offset="100%" stop-color="#2D2A36"/>
    </linearGradient>
    <pattern id="mhGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2D9CC" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Editorial Card Canvas with subtle warm tactile border -->
  <rect width="880" height="270" rx="16" fill="url(#mhCanvas)"/>
  <rect width="880" height="270" rx="16" fill="url(#mhGrid)"/>
  <rect x="0.5" y="0.5" width="879" height="269" rx="15.5" fill="none" stroke="#D8CEBF" stroke-width="1"/>

  <!-- Left Accent Structural Border -->
  <path d="M 16 24 L 16 246" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Editorial Publication Header Bar -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="84" height="20" rx="4" fill="#1E1C24"/>
    <text x="42" y="14" fill="#FAF7F2" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">VOL. 01</text>
    <text x="96" y="14" fill="#6B6457" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">ENGINEERING JOURNAL // SYSTEMS ARCHITECTURE &amp; PRODUCT DESIGN</text>
    <text x="808" y="14" fill="#B45309" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1" text-anchor="end">EST. 2024</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="62" x2="844" y2="62" stroke="#DFD5C6" stroke-width="1"/>

  <!-- Main Identity Typographic Hierarchy -->
  <g transform="translate(36, 78)">
    <!-- Subtitle Meta -->
    <text x="0" y="24" fill="#4F46E5" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="2">INDEPENDENT PRODUCT BUILDER × EXPERIMENTAL ENGINEER</text>

    <!-- Large Display Heading -->
    <text x="0" y="66" fill="#18161D" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">Kyaw Zay Ya Hein</text>

    <!-- Brand Statement -->
    <text x="0" y="98" fill="#4A453E" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-style="italic" font-weight="500">"Clean enough to trust. Distinctive enough to remember."</text>

    <!-- Editorial Badges (Replacing personal coordinates) -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="180" height="24" rx="4" fill="#EFE8DC" stroke="#DCD1C0" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#D97706"/>
      <text x="22" y="16" fill="#2E2A23" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10.5" font-weight="600">MIIT CSE · Expected 2027</text>

      <rect x="190" y="0" width="230" height="24" rx="4" fill="#EFE8DC" stroke="#DCD1C0" stroke-width="1"/>
      <circle cx="202" cy="12" r="3.5" fill="#4F46E5"/>
      <text x="212" y="16" fill="#2E2A23" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10.5" font-weight="600">PRODUCT SYSTEMS LAB</text>
    </g>
  </g>

  <!-- Right Geometric Emblem & Orbital System -->
  <g transform="translate(734, 150)">
    <!-- Outer Orbital Rings -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#D4C7B5" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#E2D6C5" stroke-width="1"/>
    <circle cx="0" cy="0" r="48" fill="#F0E8DC" stroke="#C8BAA6" stroke-width="1.2"/>

    <!-- Cardinal Ticks -->
    <line x1="0" y1="-76" x2="0" y2="-66" stroke="#D97706" stroke-width="2"/>
    <line x1="0" y1="66" x2="0" y2="76" stroke="#4F46E5" stroke-width="2"/>
    <line x1="-76" y1="0" x2="-66" y2="0" stroke="#8C8275" stroke-width="1.5"/>
    <line x1="66" y1="0" x2="76" y2="0" stroke="#8C8275" stroke-width="1.5"/>

    <!-- Orbital Points -->
    <circle cx="44" cy="-44" r="3.5" fill="#D97706"/>
    <circle cx="-38" cy="48" r="2.5" fill="#4F46E5"/>
    <circle cx="56" cy="24" r="2" fill="#2E2A23"/>

    <!-- Central Diamond Monogram Seal -->
    <polygon points="0,-32 32,0 0,32 -32,0" fill="url(#monogramGrad)" stroke="#D97706" stroke-width="1.5"/>
    <text x="-1" y="6" fill="#FAF7F2" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="17" font-weight="900" letter-spacing="1" text-anchor="middle">KZ</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%" fill="none" role="img" aria-label="GeoAlert AI — Geospatial Hazard Simulation and Vulnerability Proxy">
  <defs>
    <linearGradient id="geoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="50%" stop-color="#15171D"/>
      <stop offset="100%" stop-color="#0F1014"/>
    </linearGradient>
    <pattern id="geoMesh" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#262934" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Terrain Charcoal Canvas -->
  <rect width="880" height="280" rx="16" fill="url(#geoBg)"/>
  <rect width="880" height="280" rx="16" fill="url(#geoMesh)"/>
  <rect x="0.5" y="0.5" width="879" height="279" rx="15.5" fill="none" stroke="#2D313E" stroke-width="1"/>

  <!-- Top System Header Bar -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="76" height="20" rx="4" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="1"/>
    <text x="38" y="14" fill="#FB923C" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">SYS.04</text>
    <text x="86" y="14" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">GEOALERT AI // GEOSPATIAL HAZARD SIMULATION &amp; INFRASTRUCTURE EXPOSURE</text>
    
    <rect x="620" y="0" width="228" height="20" rx="4" fill="#242836" stroke="#373E52" stroke-width="1"/>
    <text x="734" y="14" fill="#CBD5E1" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">HACKATHON MM-041 · MON STATE</text>
  </g>

  <!-- Subhead Meta with Transparent Prototype Limitation -->
  <text x="32" y="66" fill="#F87171" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5">PROTOTYPE HAZARD PROXY MODEL · NASA SRTM 30m DEM + CHIRPS RAINFALL · NO LIVE TELEMETRY CLAIMED</text>

  <!-- Left: Multi-Criteria Hazard Scoring Formulas -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="410" height="150" rx="8" fill="#13151B" stroke="#252936" stroke-width="1"/>
    
    <text x="16" y="22" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">WEIGHTED HAZARD SCORING FORMULAS</text>

    <!-- Formula 1: Flood Risk -->
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="378" height="28" rx="4" fill="#1B1E28" stroke="#38BDF8" stroke-width="1"/>
      <text x="12" y="18" fill="#38BDF8" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700">FLOOD RISK = 45%(Rain) + 35%(Elev⁻¹) + 20%(Waterway)</text>
    </g>

    <!-- Formula 2: Landslide Risk -->
    <g transform="translate(16, 66)">
      <rect x="0" y="0" width="378" height="28" rx="4" fill="#1B1E28" stroke="#FB923C" stroke-width="1"/>
      <text x="12" y="18" fill="#FB923C" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700">LANDSLIDE RISK = 60%(Slope) + 40%(Rainfall)</text>
    </g>

    <!-- Formula 3: Comms Access Vulnerability -->
    <g transform="translate(16, 100)">
      <rect x="0" y="0" width="378" height="38" rx="4" fill="#1B1E28" stroke="#A78BFA" stroke-width="1"/>
      <text x="12" y="16" fill="#A78BFA" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700">COMMS ACCESS VULNERABILITY (PRIORITIZATION PROXY):</text>
      <text x="12" y="30" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="8.5">55%(Combined Hazard) + 30%(WorldPop Density) + 15%(Corridor Isolation)</text>
    </g>
  </g>

  <!-- Right: Mawlamyine–Paung Corridor Simulation Overlay & Evacuation Routing -->
  <g transform="translate(470, 85)">
    <rect x="0" y="0" width="378" height="150" rx="8" fill="#13151B" stroke="#252936" stroke-width="1"/>
    
    <text x="14" y="22" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">MAWLAMYINE–PAUNG CORRIDOR RISK SIMULATION</text>

    <!-- Topographic Hazard Polygons -->
    <!-- Low Hazard Region -->
    <polygon points="20,120 80,135 150,110 90,80" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1"/>
    <text x="60" y="110" fill="#34D399" font-family="'SF Mono', Consolas, monospace" font-size="8">LOW RISK</text>

    <!-- Medium Hazard Region -->
    <polygon points="120,60 210,40 250,90 170,105" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1"/>
    <text x="170" y="75" fill="#FBBF24" font-family="'SF Mono', Consolas, monospace" font-size="8">MED RISK</text>

    <!-- High Hazard Region (Flood Inundation Polygon) -->
    <polygon points="240,45 340,55 320,125 220,105" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.2"/>
    <text x="260" y="90" fill="#F87171" font-family="'SF Mono', Consolas, monospace" font-size="8">HIGH FLOOD</text>

    <!-- Telecom Tower Markers -->
    <g transform="translate(180, 80)">
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#E2E8F0" stroke-width="1.5"/>
      <polygon points="0,-16 -4,-8 4,-8" fill="#E2E8F0"/>
      <circle cx="0" cy="0" r="2.5" fill="#F59E0B"/>
      <text x="8" y="-6" fill="#E2E8F0" font-family="'SF Mono', Consolas, monospace" font-size="7.5">Tower #12 (Med)</text>
    </g>
    <g transform="translate(280, 85)">
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#EF4444" stroke-width="1.5"/>
      <polygon points="0,-16 -4,-8 4,-8" fill="#EF4444"/>
      <circle cx="0" cy="0" r="2.5" fill="#EF4444"/>
      <text x="8" y="-6" fill="#F87171" font-family="'SF Mono', Consolas, monospace" font-size="7.5">Tower #07 (High Exposure)</text>
    </g>

    <!-- Evacuation Route Dijkstra (Bypasses High Hazard) -->
    <path d="M 20 130 Q 140 135 180 115 T 350 130" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="210" y="142" fill="#38BDF8" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">Dijkstra Evacuation Route (Penalty: Low=1x, Med=2x, High=5x)</text>
  </g>

  <!-- Footer Specs -->
  <g transform="translate(32, 260)">
    <text x="0" y="0" fill="#64748B" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5">TECH STACK: Python Streamlit · PyDeck (deck.gl 3D) · Pandas · GeoPandas · OpenStreetMap API · NASA SRTM</text>
    <text x="816" y="0" fill="#64748B" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5" text-anchor="end">ROLE: TEAM CONTRIBUTOR (FRONTEND &amp; 3D PYDECK)</text>
  </g>
</svg>
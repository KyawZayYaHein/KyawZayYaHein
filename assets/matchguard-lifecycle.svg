<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%" fill="none" role="img" aria-label="MatchGuard — Trust-Based Marketplace Architecture">
  <defs>
    <linearGradient id="mgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="50%" stop-color="#14151B"/>
      <stop offset="100%" stop-color="#0E0F13"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="mgDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#2E313E" fill-opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Technical Graphite Slate Background -->
  <rect width="880" height="280" rx="16" fill="url(#mgBg)"/>
  <rect width="880" height="280" rx="16" fill="url(#mgDots)"/>
  <rect x="0.5" y="0.5" width="879" height="279" rx="15.5" fill="none" stroke="#2B2D3A" stroke-width="1"/>

  <!-- Top System Header Bar -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="76" height="20" rx="4" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="38" y="14" fill="#60A5FA" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">SYS.01</text>
    <text x="86" y="14" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">MATCHGUARD // TRUST-BASED MARKETPLACE ARCHITECTURE</text>
    
    <!-- Non-Custodial Marketplace Badge -->
    <rect x="500" y="0" width="180" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <circle cx="510" cy="10" r="3" fill="#34D399"/>
    <text x="518" y="14" fill="#A7F3D0" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.5">NON-CUSTODIAL PLATFORM</text>

    <!-- Test Evidence Badge -->
    <rect x="690" y="0" width="158" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <text x="769" y="14" fill="#DDD6FE" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5" text-anchor="middle">167 UNIT TESTS PASSING</text>
  </g>

  <!-- Architecture Subhead Note -->
  <text x="32" y="66" fill="#94A3B8" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="500">SERVER-ENFORCED ORDER LIFECYCLE · ACTOR-BASED DOMAIN INVARIANTS · AUDITABLE ORDER STATUS HISTORY</text>

  <!-- Main Sequential Flow Backbone -->
  <line x1="120" y1="125" x2="760" y2="125" stroke="url(#flowLine)" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- State 1: PLACED -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#1E202B" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="16" cy="18" r="4" fill="#60A5FA"/>
    <text x="26" y="21" fill="#93C5FD" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700">STATE 00</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Placed</text>
    <!-- Method tag -->
    <rect x="0" y="66" width="120" height="18" rx="3" fill="#141722" stroke="#2B3042" stroke-width="1"/>
    <text x="60" y="78" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="8.5" text-anchor="middle">Order(buyerId, sellerId)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 188 125 L 230 125" stroke="#60A5FA" stroke-width="2"/>

  <!-- State 2: ACCEPTED -->
  <g transform="translate(240, 95)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#1E202B" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="16" cy="18" r="4" fill="#A78BFA"/>
    <text x="26" y="21" fill="#DDD6FE" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700">STATE 01</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Accepted</text>
    <!-- Method tag -->
    <rect x="0" y="66" width="120" height="18" rx="3" fill="#141722" stroke="#2B3042" stroke-width="1"/>
    <text x="60" y="78" fill="#A78BFA" font-family="'SF Mono', Consolas, monospace" font-size="8.5" text-anchor="middle">Accept(sellerUserId)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 368 125 L 410 125" stroke="#A78BFA" stroke-width="2"/>

  <!-- State 3: SHIPPED -->
  <g transform="translate(420, 95)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#1E202B" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="16" cy="18" r="4" fill="#FBBF24"/>
    <text x="26" y="21" fill="#FDE68A" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700">STATE 02</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Shipped</text>
    <!-- Method tag -->
    <rect x="0" y="66" width="120" height="18" rx="3" fill="#141722" stroke="#2B3042" stroke-width="1"/>
    <text x="60" y="78" fill="#FBBF24" font-family="'SF Mono', Consolas, monospace" font-size="8.5" text-anchor="middle">Ship(sellerUserId, ref)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 548 125 L 590 125" stroke="#FBBF24" stroke-width="2"/>

  <!-- State 4: COMPLETED -->
  <g transform="translate(600, 95)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#1E202B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="16" cy="18" r="4" fill="#34D399"/>
    <text x="26" y="21" fill="#A7F3D0" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700">STATE 03</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Completed</text>
    <!-- Method tag -->
    <rect x="0" y="66" width="120" height="18" rx="3" fill="#141722" stroke="#2B3042" stroke-width="1"/>
    <text x="60" y="78" fill="#34D399" font-family="'SF Mono', Consolas, monospace" font-size="8.5" text-anchor="middle">ConfirmDelivery(buyerId)</text>
  </g>

  <!-- Guarded Alternate State Branches -->
  <!-- Branch A: Cancelled -->
  <g transform="translate(240, 206)">
    <path d="M -120 -51 L -120 18 L 0 18" fill="none" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="0" y="0" width="120" height="38" rx="6" fill="#18151A" stroke="#EF4444" stroke-width="1"/>
    <text x="10" y="16" fill="#FCA5A5" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">BRANCH 04</text>
    <text x="10" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Cancelled</text>
    <text x="130" y="24" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9">Cancel(actorId, reason) · Pre-shipment guard</text>
  </g>

  <!-- Branch B: Disputed -->
  <g transform="translate(600, 206)">
    <path d="M -120 -51 L -120 18 L 0 18" fill="none" stroke="#F97316" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="0" y="0" width="120" height="38" rx="6" fill="#1A1715" stroke="#F97316" stroke-width="1"/>
    <text x="10" y="16" fill="#FDBA74" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">BRANCH 05</text>
    <text x="10" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Disputed</text>
    <text x="130" y="24" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9">MarkDisputed() → AdminResolveDispute()</text>
  </g>

  <!-- Footer Specification Details -->
  <g transform="translate(32, 260)">
    <text x="0" y="0" fill="#64748B" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5">TECH STACK: ASP.NET Core (.NET 10) · PostgreSQL 16 · Entity Framework Core 10 · MediatR CQRS · xUnit 2.9.3</text>
    <text x="816" y="0" fill="#64748B" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5" text-anchor="end">DOMAIN RULES: SEC-07 · SEC-08</text>
  </g>
</svg>